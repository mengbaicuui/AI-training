<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <rect x="40" y="36" width="1120" height="688" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="70" y="94" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0F172A">BM25 评分公式</text>
  <text x="70" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#475569">最值得关注的调参旋钮：k1 控制词频饱和，b 控制文档长度归一化。</text>

  <rect x="70" y="162" width="1060" height="160" rx="18" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="110" y="225" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#0F172A">
    <tspan x="110" dy="0">score(D,Q) = Σ IDF(q) · </tspan>
    <tspan x="110" dy="42">(( f(q,D) · (k1 + 1) ) / ( f(q,D) + k1 · (1 - b + b · |D| / avgdl ) ))</tspan>
  </text>

  <rect x="92" y="190" width="138" height="60" rx="14" fill="#FDE68A" fill-opacity="0.55" stroke="#F59E0B" stroke-width="2"/>
  <text x="106" y="285" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#B45309">稀有词权重</text>

  <rect x="520" y="228" width="92" height="60" rx="14" fill="#BFDBFE" fill-opacity="0.7" stroke="#2563EB" stroke-width="2"/>
  <text x="544" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1D4ED8">k1</text>

  <rect x="770" y="228" width="64" height="60" rx="14" fill="#C7F9CC" fill-opacity="0.85" stroke="#16A34A" stroke-width="2"/>
  <text x="792" y="345" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#15803D">b</text>

  <line x1="566" y1="288" x2="566" y2="358" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="802" y1="288" x2="802" y2="358" stroke="#16A34A" stroke-width="2.5" stroke-dasharray="6 6"/>

  <rect x="70" y="370" width="500" height="292" rx="20" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="96" y="412" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1D4ED8">k1：词频饱和</text>
  <text x="96" y="455" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">它控制什么：</text>
  <text x="122" y="489" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">• 同一个词重复出现时，还能加多少分</text>
  <text x="122" y="521" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">• k1 越大，重复出现越“值钱”</text>
  <text x="122" y="553" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">• k1 越小，词频收益越快饱和</text>
  <text x="96" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E293B">实战影响</text>
  <text x="122" y="634" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">• 高 k1：适合“重复提到关键词就更相关”的场景</text>
  <text x="122" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">• 低 k1：适合模板噪声多、重复词不一定更相关的语料</text>

  <rect x="610" y="370" width="480" height="292" rx="20" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="636" y="412" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#15803D">b：长度归一化</text>
  <text x="636" y="455" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#334155">它控制什么：</text>
  <text x="662" y="489" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">• 长文档会被惩罚到什么程度</text>
  <text x="662" y="521" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">• b 越大，对长文档惩罚越强</text>
  <text x="662" y="553" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#334155">• b 越小，对长文档惩罚越弱</text>
  <text x="636" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1E293B">实战影响</text>
  <text x="662" y="634" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">• 高 b：更偏向短小、聚焦的文档</text>
  <text x="662" y="664" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">• 低 b：适合长手册、长规范里经常藏答案的场景</text>
</svg>
